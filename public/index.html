<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sur Dorado - Vendedores</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16233d">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --bg:#16233d; --panel:#1e3050; --panel2:#182642; --border:#2f4468;
    --text:#eef2f9; --text2:#aab6cc; --text3:#7c8aa8;
    --cerveza:#eb6834; --agua:#2a78d6; --vinos:#e87ba4; --sidras:#eda100;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent;}
  input,select,button{font-family:inherit;}
  .screen{display:none; min-height:100vh; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---- Login ---- */
  #screenLogin{align-items:center; justify-content:center; padding:20px;}
  .login-box{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px 26px; width:100%; max-width:320px; text-align:center;}
  .login-box .brand{font-weight:900; font-size:22px; margin-bottom:4px;}
  .login-box .brand span{display:block; font-size:14px; font-weight:700; color:#e8c987;}
  .login-box h2{font-size:14px; font-weight:600; color:var(--text2); margin:18px 0 20px;}
  .login-box input{width:100%; padding:12px 14px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;}
  .login-box button{width:100%; padding:13px; border-radius:8px; border:none; background:#3b82f6; color:#fff; font-weight:700; font-size:15px; margin-top:6px;}
  .login-error{color:#f18a8f; font-size:13px; min-height:18px; margin-bottom:4px;}

  /* ---- Topbar comun ---- */
  .topbar{display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
  .topbar .back-btn{background:none; border:none; color:var(--text); font-size:22px; padding:4px 8px; cursor:pointer;}
  .topbar .title{font-weight:700; font-size:15px; flex:1;}
  .topbar .logout-btn{background:none; border:none; color:var(--text3); font-size:13px; cursor:pointer;}
  .content{flex:1; padding:16px; overflow-y:auto; width:100%; max-width:640px; margin:0 auto;}
  .topbar-inner{display:flex; align-items:center; gap:10px; width:100%;}
  @media (min-width:700px){
    .topbar-inner{max-width:640px; margin:0 auto;}
    .cat-grid{grid-template-columns:repeat(4,1fr);}
  }

  /* ---- Selector screen ---- */
  .greeting{font-size:18px; font-weight:800; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text2); margin-bottom:6px; font-weight:600;}
  .field select{width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;}

  /* ---- Selector propio (reemplaza <select> nativo, evita bug del picker de Android en PWA) ---- */
  .cselect{position:relative;}
  .cselect-btn{width:100%; text-align:left; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; display:flex; justify-content:space-between; align-items:center;}
  .cselect-btn:disabled{color:var(--text3);}
  .cselect-btn::after{content:'▾'; color:var(--text3); margin-left:8px;}
  .cselect-panel{display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50; background:var(--panel2); border:1px solid var(--border); border-radius:10px; max-height:260px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .cselect-panel.open{display:block;}
  .cselect-option{padding:12px 14px; font-size:14.5px; cursor:pointer; border-bottom:1px solid var(--border);}
  .cselect-option:last-child{border-bottom:none;}
  .cselect-option:active, .cselect-option.highlight{background:var(--panel);}

  .summary-total{background:#2a78d6; border-radius:14px; padding:18px; margin:18px 0 14px;}
  .summary-total .label{font-size:12px; color:#cfe0fb; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .summary-total .value{font-size:32px; font-weight:900; margin-top:4px;}

  .cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px;}
  .cat-card{background:var(--panel); border-radius:12px; padding:12px; border-top:3px solid var(--c);}
  .cat-card .lbl{font-size:11.5px; color:var(--text2); font-weight:700; display:flex; align-items:center; gap:5px;}
  .cat-card .num{font-size:22px; font-weight:900; margin-top:4px;}

  .search-box{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; margin-bottom:12px;}
  .client-item{background:var(--panel); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .client-item .name{font-weight:700; font-size:14.5px;}
  .client-item .addr{font-size:12.5px; color:var(--text2); margin-top:2px;}
  .client-item .code{font-size:11.5px; color:var(--text3);}
  .client-item .arrow{color:var(--text3); font-size:18px; margin-left:8px;}
  .empty-msg{color:var(--text3); text-align:center; padding:30px 10px; font-size:14px;}

  /* ---- Cliente screen ---- */
  .cliente-header{margin-bottom:16px;}
  .cliente-header .name{font-size:17px; font-weight:800;}
  .cliente-header .addr{font-size:13px; color:var(--text2); margin-top:2px;}
  .cat-section{background:var(--panel); border-radius:12px; padding:14px; margin-bottom:12px; border-top:3px solid var(--c);}
  .cat-section .cat-title{font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .marca-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);}
  .marca-row:last-child{border-bottom:none;}
  .marca-row .mname{font-size:14px; cursor:pointer;}
  .marca-row .mhl{font-weight:700; font-size:14px;}
  .sin-compra{color:var(--text3); font-size:13.5px; padding:6px 0;}

  /* ---- Marca (articulos) screen ---- */
  .art-row{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border-radius:10px; padding:12px 14px;
