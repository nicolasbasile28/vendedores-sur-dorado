<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sur Dorado - Vendedores</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16233d">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --bg:#16233d; --panel:#1e3050; --panel2:#182642; --border:#2f4468;
    --text:#eef2f9; --text2:#aab6cc; --text3:#7c8aa8;
    --cerveza:#eb6834; --agua:#2a78d6; --vinos:#e87ba4; --sidras:#eda100;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent;}
  input,select,button{font-family:inherit;}
  .screen{display:none; min-height:100vh; flex-direction:column;}
  .screen.active{display:flex;}
  #screenLogin{align-items:center; justify-content:center; padding:20px;}
  .login-box{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px 26px; width:100%; max-width:320px; text-align:center;}
  .login-box .brand{font-weight:900; font-size:22px; margin-bottom:4px;}
  .login-box .brand span{display:block; font-size:14px; font-weight:700; color:#e8c987;}
  .login-box h2{font-size:14px; font-weight:600; color:var(--text2); margin:18px 0 20px;}
  .login-box input{width:100%; padding:12px 14px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;}
  .login-box button{width:100%; padding:13px; border-radius:8px; border:none; background:#3b82f6; color:#fff; font-weight:700; font-size:15px; margin-top:6px;}
  .login-error{color:#f18a8f; font-size:13px; min-height:18px; margin-bottom:4px;}
  .topbar{display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
  .topbar .back-btn{background:none; border:none; color:var(--text); font-size:22px; padding:4px 8px; cursor:pointer;}
  .topbar .title{font-weight:700; font-size:15px; flex:1;}
  .topbar .logout-btn{background:none; border:none; color:var(--text3); font-size:13px; cursor:pointer;}
  .content{flex:1; padding:16px; overflow-y:auto; width:100%; max-width:640px; margin:0 auto;}
  .topbar-inner{display:flex; align-items:center; gap:10px; width:100%;}
  @media (min-width:700px){
    .topbar-inner{max-width:640px; margin:0 auto;}
    .cat-grid{grid-template-columns:repeat(4,1fr);}
  }
  .greeting{font-size:18px; font-weight:800; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text2); margin-bottom:6px; font-weight:600;}
  .field select{width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px;}
  .cselect{position:relative;}
  .cselect-btn{width:100%; text-align:left; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; display:flex; justify-content:space-between; align-items:center;}
  .cselect-btn:disabled{color:var(--text3);}
  .cselect-btn::after{content:'▾'; color:var(--text3); margin-left:8px;}
  .cselect-panel{display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50; background:var(--panel2); border:1px solid var(--border); border-radius:10px; max-height:260px;
